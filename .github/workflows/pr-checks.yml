name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

jobs:
  validate-pr:
    name: Validate PR Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          # Pattern: type(optional-scope): description
          # Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?:[[:space:]].+ ]]; then
            echo "❌ PR title must follow conventional commits format:"
            echo "   Format: type(scope): description"
            echo "   Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
            echo "   Example: feat(auth): add login functionality"
            echo "   Example: docs: update README"
            echo "   Current title: '$PR_TITLE'"
            exit 1
          fi
          echo "✅ PR title format is valid: '$PR_TITLE'"

      - name: Check for force push
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "⚠️  PR is from a fork, skipping force push check"
            exit 0
          fi
          
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Check if base branch has been force-pushed
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
            echo "❌ Force push detected! Base branch may have been force-pushed."
            echo "   This is not allowed. Please rebase your branch instead."
            exit 1
          fi
          echo "✅ No force push detected"

      - name: Check commit messages
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          COMMITS=$(git log --format="%s" $BASE_SHA..$HEAD_SHA)
          
          while IFS= read -r commit; do
            if [[ ! "$commit" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert|Merge|Revert)(\(.+\))?: .+ ]]; then
              echo "❌ Commit message doesn't follow conventional commits:"
              echo "   '$commit'"
              echo "   Format: type(scope): description"
              exit 1
            fi
          done <<< "$COMMITS"
          echo "✅ All commit messages follow conventional commits format"

      - name: Check for large files
        run: |
          MAX_FILE_SIZE=5242880  # 5MB
          LARGE_FILES=$(find . -type f -size +${MAX_FILE_SIZE}c -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./dist/*" -not -path "./coverage/*" || true)
          
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Large files detected (>5MB):"
            echo "$LARGE_FILES"
            echo "Please use Git LFS or remove these files"
            exit 1
          fi
          echo "✅ No large files detected"

      - name: Check for sensitive data
        run: |
          SENSITIVE_PATTERNS=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "secret\s*=\s*['\"][^'\"]+['\"]"
            "token\s*=\s*['\"][^'\"]+['\"]"
            "private[_-]?key"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN PRIVATE KEY"
          )
          
          FOUND_SENSITIVE=false
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            if git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -iE "$pattern" | grep -vE "^(---|\+\+\+|@@|index)" | grep -vE "test|example|mock|sample|dummy" > /dev/null; then
              echo "⚠️  Potential sensitive data detected matching pattern: $pattern"
              FOUND_SENSITIVE=true
            fi
          done
          
          if [ "$FOUND_SENSITIVE" = true ]; then
            echo "❌ Potential sensitive data detected in changes"
            echo "Please review and ensure no secrets are committed"
            exit 1
          fi
          echo "✅ No sensitive data detected"

