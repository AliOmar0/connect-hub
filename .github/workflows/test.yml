# Legacy test workflow - replaced by ci.yml
# This file is kept for backward compatibility but ci.yml is the primary workflow
name: Tests (Legacy)

on:
  workflow_dispatch:  # Only run manually if needed

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run


