# Connect-Hub full stack (G18, G35).
# Secrets are read from a local .env file (never committed). Copy .env.example.
#
# Common commands:
#   docker compose up --build              # core stack: redis, node-api, edge-tts, web
#   docker compose --profile monitoring up # also start Prometheus + Grafana
#
# There is no otp-service here: OTP generation/delivery/verification is
# embedded in whatsapp-support-backend (app/core/otp_client.py) rather than a
# separate process. That backend is not part of this compose file; run it
# separately (see whatsapp-support-backend/docs/RUNNING_BACKEND.md).
#
# TTS defaults to the FREE edge-tts service so no paid TTS credits are used.
# Override by setting TTS_PROVIDER (e.g. azure) in your .env.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Free Arabic TTS (Microsoft Edge online voices, no API key, no credits).
  edge-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    ports:
      - "5070:5070"
    restart: unless-stopped

  node-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Default to the free local TTS provider; override via .env if desired.
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      EDGE_TTS_URL: http://edge-tts:5070
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      edge-tts:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - "8080:80"
    depends_on:
      - node-api

  # Optional observability stack. Start with: docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node-api

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  grafana-data:
