<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIB AI Assistant - Arabic LLM Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Kufi+Arabic:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-circle">
                    <i data-lucide="bot"></i>
                </div>
                <h1>مساعد PIB الرقمي</h1>
            </div>
            <nav class="history" id="chat-sessions">
                <!-- Session items will be added here dynamically -->
            </nav>
            <button class="new-chat-btn" id="new-chat-trigger">
                <i data-lucide="plus"></i>
                <span>محادثة جديدة</span>
            </button>
            <div class="user-profile">
                <div class="avatar">U</div>
                <div class="user-info">
                    <span class="user-name">مستخدم تجريبي</span>
                    <span class="user-status">متصل</span>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <div class="model-info">
                    <span class="model-badge">OLMo 3.1 32B</span>
                    <span class="status-dot"></span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="حفظ المحادثة"><i data-lucide="save"></i></button>
                    <button class="icon-btn" title="إعدادات"><i data-lucide="settings"></i></button>
                </div>
            </header>

            <div class="messages-container" id="messages">
                <!-- Messages will appear here -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon"><i data-lucide="bot"></i></div>
                    <h2>كيف يمكنني مساعدتك اليوم؟</h2>
                    <p>أنا مساعدك الرقمي من البنك الإسلامي الفلسطيني، جاهز للإجابة على استفساراتك حول حلولنا المصرفية
                        المتوافقة مع الشريعة.</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <button class="attach-btn"><i data-lucide="plus"></i></button>
                    <textarea placeholder="اكتب استفسارك هنا..." rows="1"></textarea>
                    <button class="send-btn"><i data-lucide="send"></i></button>
                </div>
                <p class="disclaimer">قد يرتكب الذكاء الاصطناعي أخطاء. يرجى التحقق من المعلومات المهمة.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
